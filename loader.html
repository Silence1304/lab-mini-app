<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Очередь сборки — Склад</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f4f5);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #1c1c1e);
      --hint-color: var(--tg-theme-hint-color, #8e8e93);
      --button-color: var(--tg-theme-button-color, #007aff);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --border-color: #d1d1d6;
      --success-color: #34c759;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    h2 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 16px;
    }

    .order-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border-left: 5px solid var(--button-color);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--hint-color);
      margin-bottom: 8px;
    }

    .item-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .item-details {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #e5e5ea;
      font-size: 14px;
    }

    .location-badge {
      background: rgba(0, 122, 255, 0.1);
      color: var(--button-color);
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 600;
    }

    .qty-badge {
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      color: var(--hint-color);
      margin-top: 40px;
      font-size: 15px;
    }

    .refresh-btn {
      width: 100%;
      background-color: var(--button-color);
      color: var(--button-text);
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <h2>👷 Очередь сборки</h2>
  <button class="refresh-btn" onclick="loadLoaderOrders()">🔄 Обновить список</button>
  
  <div id="orders-container">
    <div class="empty-state">Загрузка задач...</div>
  </div>

  <script>
    // Автоматически определяем базовый URL скрипта из текущего адреса страницы
    const CURRENT_URL = window.location.href.split('?')[0];
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.expand();
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadLoaderOrders();
    });

    async function loadLoaderOrders() {
      const container = document.getElementById("orders-container");
      container.innerHTML = '<div class="empty-state">⏳ Получение данных со склада...</div>';

      try {
        const response = await fetch(`${CURRENT_URL}?action=get_loader_orders`);
        const data = await response.json();

        if (data.success && data.orders) {
          if (data.orders.length === 0) {
            container.innerHTML = '<div class="empty-state">🎉 Активных задач на выдачу нет!</div>';
            return;
          }

          container.innerHTML = "";
          data.orders.forEach(order => {
            const card = document.createElement("div");
            card.className = "order-card";
            card.innerHTML = `
              <div class="order-header">
                <span>📍 ${order.lab}</span>
                <span>🕒 ${order.time || 'Только что'}</span>
              </div>
              <div class="item-name">${order.name}</div>
              <div class="item-details">
                <span>Кол-во: <span class="qty-badge">${order.qty}</span></span>
                <span class="location-badge">Место: ${order.location}</span>
              </div>
            `;
            container.innerHTML += card.outerHTML;
          });
        } else {
          container.innerHTML = `<div class="empty-state">❌ Ошибка: ${data.error || "Не удалось загрузить задачи"}</div>`;
        }
      } catch (err) {
        container.innerHTML = '<div class="empty-state">❌ Ошибка сети при загрузке очереди</div>';
      }
    }
  </script>
</body>
</html>
