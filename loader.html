<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Очередь сборки — Склад</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f4f5);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #1c1c1e);
      --hint-color: var(--tg-theme-hint-color, #8e8e93);
      --button-color: var(--tg-theme-button-color, #007aff);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --border-color: #d1d1d6;
      --accent-bg: rgba(0, 122, 255, 0.05);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    h2 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 16px;
    }

    .order-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid transparent;
    }

    .order-card:active {
      background: var(--accent-bg);
    }

    .order-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .order-title {
      font-size: 16px;
      font-weight: 600;
    }

    .order-meta {
      font-size: 13px;
      color: var(--hint-color);
      margin-top: 4px;
      display: flex;
      gap: 10px;
    }

    /* Список позиций внутри заказа */
    .items-list {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #e5e5ea;
      display: none;
    }

    .order-card.expanded .items-list {
      display: block;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      margin-bottom: 6px;
      background: var(--bg-color);
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .item-row:hover {
      background: rgba(0, 122, 255, 0.1);
    }

    .item-name-text {
      flex-grow: 1;
      padding-right: 10px;
    }

    .item-qty {
      font-weight: 600;
      white-space: nowrap;
    }

    /* Состояние клика по позиции (показ места хранения) */
    .item-row.location-view {
      background: #e8f5e9 !important;
      color: #2e7d32;
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      color: var(--hint-color);
      margin-top: 40px;
      font-size: 15px;
    }

    .refresh-btn {
      width: 100%;
      background-color: var(--button-color);
      color: var(--button-text);
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <h2>👷 Очередь заказов</h2>
  <button class="refresh-btn" onclick="loadLoaderOrders()">🔄 Обновить список</button>
  
  <div id="orders-container">
    <div class="empty-state">Загрузка задач...</div>
  </div>

  <script>
    const CURRENT_URL = window.location.href.split('?')[0];
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.expand();
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadLoaderOrders();
    });

    async function loadLoaderOrders() {
      const container = document.getElementById("orders-container");
      container.innerHTML = '<div class="empty-state">⏳ Получение данных со склада...</div>';

      try {
        const response = await fetch(`${CURRENT_URL}?action=get_loader_orders`);
        const data = await response.json();

        if (data.success && data.orders) {
          if (data.orders.length === 0) {
            container.innerHTML = '<div class="empty-state">🎉 Активных задач на выдачу нет!</div>';
            return;
          }

          container.innerHTML = "";
          data.orders.forEach((order, index) => {
            const card = document.createElement("div");
            card.className = "order-card";
            
            // Заголовок заказа
            let html = `
              <div class="order-header-row">
                <span class="order-title">Заказ #${index + 1} (${order.category})</span>
                <span style="font-size: 12px; color: var(--hint-color);">${order.time}</span>
              </div>
              <div class="order-meta">
                <span>📍 Лаборатория ${order.lab}</span>
              </div>
              <div class="items-list">
            `;

            // Список позиций внутри
            order.items.forEach(item => {
              html += `
                <div class="item-row" onclick="toggleLocation(event, this, '${escapeHtml(item.name)}', '${escapeHtml(item.location)}')">
                  <span class="item-name-text">${escapeHtml(item.name)}</span>
                  <span class="item-qty">${item.qty} шт.</span>
                </div>
              `;
            });

            html += `</div>`;
            card.innerHTML = html;

            // Клик по карточке разворачивает/сворачивает список позиций
            card.addEventListener("click", (e) => {
              // Если кликнули по самой позиции, карточку не сворачиваем
              if (e.target.closest('.item-row')) return;
              card.classList.toggle("expanded");
            });

            container.appendChild(card);
          });
        } else {
          container.innerHTML = `<div class="empty-state">❌ Ошибка: ${data.error || "Не удалось загрузить задачи"}</div>`;
        }
      } catch (err) {
        container.innerHTML = '<div class="empty-state">❌ Ошибка сети при загрузке очереди</div>';
      }
    }

    // Интерактив по клику на позицию: замена названия на место хранения и обратно
    function toggleLocation(event, rowElement, originalName, locationText) {
      event.stopPropagation(); // чтобы не триггерить сворачивание карточки заказа
      
      const nameSpan = rowElement.querySelector(".item-name-text");
      
      if (rowElement.classList.contains("location-view")) {
        // Возвращаем название
        nameSpan.innerText = originalName;
        rowElement.classList.remove("location-view");
      } else {
        // Показываем место хранения из столбца N
        nameSpan.innerText = "📍 Место: " + locationText;
        rowElement.classList.add("location-view");
      }
    }

    function escaparHTML(str) {
      return str;
    }

    function escapeHtml(text) {
      if (!text) return "";
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
