<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Заказ реактивов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f4f5);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #1c1c1e);
      --hint-color: var(--tg-theme-hint-color, #8e8e93);
      --button-color: var(--tg-theme-button-color, #007aff);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --danger-color: #ff3b30;
      --border-color: #d1d1d6;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 16px; box-sizing: border-box; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    h2 { font-size: 18px; margin-top: 0; margin-bottom: 12px; }
    h3 { font-size: 15px; margin-top: 0; margin-bottom: 8px; text-transform: uppercase; }
    label { display: block; font-size: 13px; color: var(--hint-color); margin-bottom: 4px; margin-top: 10px; }
    input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    .btn { width: 100%; background-color: var(--button-color); color: var(--button-text); border: none; border-radius: 10px; padding: 14px; font-size: 16px; font-weight: 600; margin-top: 16px; }
    .btn:disabled { opacity: 0.5; }
    .hidden { display: none !important; }
    #status { text-align: center; font-size: 14px; margin-top: 10px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #e5e5ea; }
    .remove-btn { background: none; border: none; color: var(--danger-color); font-size: 20px; cursor: pointer; }
    .cart-section { background: #f9f9fb; border-radius: 8px; padding: 10px; margin-bottom: 12px; border: 1px solid #e5e5ea; }
  </style>
</head>
<body>

  <div class="card" id="profile-card">
    <h2>👤 Профиль сотрудника</h2>
    <label>ФИО</label>
    <input type="text" id="fio" placeholder="Иванов Иван Иванович">
    <label>Лаборатория №</label>
    <input type="text" id="lab" placeholder="102">
    <label>Организация:</label>
    <div style="display:flex; gap:16px; margin-top:6px;">
      <label><input type="radio" name="company" value="ООО" checked> ООО</label>
      <label><input type="radio" name="company" value="НПФ"> НПФ</label>
    </div>
    <button class="btn" onclick="saveProfile()">Сохранить данные</button>
  </div>

  <div class="card hidden" id="form-card">
    <h2>🧪 Форма списания</h2>
    <label>Категория</label>
    <select id="category" onchange="loadItems()">
      <option value="" disabled selected>-- Выберите категорию --</option>
      <option value="precursors">Прекурсоры</option>
      <option value="chemistry">Химия</option>
    </select>
    <div id="items-wrapper" class="hidden">
      <label>Позиция</label>
      <input type="text" id="item-input" placeholder="🔍 Название..." oninput="filterItems()">
      <div id="autocomplete-list" style="position:absolute; background:white; width:calc(100% - 32px); z-index:99; border:1px solid #ccc;"></div>
      <div id="stock-info" style="font-size: 12px; color: var(--hint-color); margin: 5px 0;"></div>
      <label>Количество</label>
      <input type="number" id="quantity" placeholder="Введите число">
      <button class="btn" style="background-color: #e5e5ea; color: #1c1c1e;" onclick="addToCart()">➕ Добавить</button>
    </div>
  </div>

  <div class="card hidden" id="cart-card">
    <h2>🛒 Корзина</h2>
    <div id="prec-cart-section" class="cart-section hidden"><h3 style="color:red">Прекурсоры</h3><div id="prec-cart-items"></div></div>
    <div id="chem-cart-section" class="cart-section hidden"><h3 style="color:blue">Химия</h3><div id="chem-cart-items"></div></div>
    <button class="btn" id="submit-btn" onclick="submitCart()">Отправить расход</button>
  </div>

  <div id="status"></div>

  <script>
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbxc17aqZjPhzlpKhh60HaadufMlrntuMhh5t7jxnom0gYrFqYqJeCGz7iM_iBeSuyctkg/exec";
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    let carts = { precursors: [], chemistry: [] };
    let currentCategoryItems = [];

    function saveProfile() {
      localStorage.setItem("lab_fio", document.getElementById("fio").value);
      localStorage.setItem("lab_num", document.getElementById("lab").value);
      localStorage.setItem("lab_company", document.querySelector('input[name="company"]:checked').value);
      document.getElementById("profile-card").classList.add("hidden");
      document.getElementById("form-card").classList.remove("hidden");
    }

    async function loadItems() {
      const category = document.getElementById("category").value;
      const response = await fetch(`${BACKEND_URL}?action=get_catalog&type=${category}`);
      const data = await response.json();
      currentCategoryItems = data.items;
      document.getElementById("items-wrapper").classList.remove("hidden");
    }

    function addToCart() {
      const cat = document.getElementById("category").value;
      const item = document.getElementById("item-input").value;
      const qty = document.getElementById("quantity").value;
      if (!item || !qty) return;
      carts[cat].push({ item, quantity: qty });
      renderCart();
    }

    function renderCart() {
      document.getElementById("cart-card").classList.remove("hidden");
      // ... логика отрисовки ...
      document.getElementById("prec-cart-items").innerHTML = carts.precursors.map((i, idx) => `<div class="cart-item">${i.item} - ${i.quantity} <button class="remove-btn" onclick="carts.precursors.splice(${idx},1);renderCart()">✕</button></div>`).join('');
      document.getElementById("chem-cart-items").innerHTML = carts.chemistry.map((i, idx) => `<div class="cart-item">${i.item} - ${i.quantity} <button class="remove-btn" onclick="carts.chemistry.splice(${idx},1);renderCart()">✕</button></div>`).join('');
      document.getElementById("prec-cart-section").classList.toggle("hidden", carts.precursors.length === 0);
      document.getElementById("chem-cart-section").classList.toggle("hidden", carts.chemistry.length === 0);
    }

    async function submitCart() {
      const base = { fio: localStorage.getItem("lab_fio"), lab: localStorage.getItem("lab_num"), company: localStorage.getItem("lab_company") };
      if (carts.precursors.length > 0) await fetch(BACKEND_URL, { method: "POST", body: JSON.stringify({...base, category: "precursors", cart: carts.precursors}) });
      if (carts.chemistry.length > 0) await fetch(BACKEND_URL, { method: "POST", body: JSON.stringify({...base, category: "chemistry", cart: carts.chemistry}) });
      alert("Отправлено!");
    }
  </script>
</body>
</html>
