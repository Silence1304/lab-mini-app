<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Списание расходников</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      margin: 0;
      padding: 16px;
      color: #1e293b;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      max-width: 480px;
      margin: 0 auto;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: #3b82f6;
    }

    .btn-add {
      width: 100%;
      padding: 12px;
      background-color: #475569;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-add:hover {
      background-color: #334155;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 15px;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    .btn-submit:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    hr {
      margin: 20px 0;
      border: 0;
      border-top: 1px solid #e2e8f0;
    }

    .cart-section {
      display: none;
    }

    .cart-header {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #1e293b;
    }

    .cart-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 10px 12px;
      border-radius: 8px;
    }

    .cart-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .cart-item-title {
      font-weight: 600;
      font-size: 14px;
      color: #0f172a;
    }

    .cart-item-sub {
      font-size: 12px;
      color: #64748b;
    }

    .btn-remove {
      background: transparent;
      border: none;
      color: #ef4444;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .btn-remove:hover {
      background-color: #fee2e2;
    }

    .status-msg {
      margin-top: 15px;
      font-weight: 600;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🧪 Форма списания</h2>

    <!-- Категория -->
    <div class="form-group">
      <label for="category">Категория</label>
      <select id="category" onchange="onCategoryChange()">
        <option value="chemistry">🥼 Химия</option>
        <option value="precursors">🧪 Прекурсоры</option>
      </select>
    </div>

    <!-- Название позиции -->
    <div class="form-group">
      <label for="item">Позиция</label>
      <input type="text" id="item" placeholder="Начните вводить название..." list="itemsList">
      <datalist id="itemsList"></datalist>
    </div>

    <!-- Компания (только для прекурсоров) -->
    <div class="form-group" id="companyGroup" style="display: none;">
      <label for="company">Компания</label>
      <input type="text" id="company" placeholder="Название компании">
    </div>

    <!-- Количество -->
    <div class="form-group">
      <label for="quantity">Количество</label>
      <input type="number" id="quantity" min="1" value="1">
    </div>

    <!-- Кнопка добавления в список -->
    <button type="button" class="btn-add" onclick="addToCart()">➕ Добавить в список</button>

    <!-- Разделитель и Корзина -->
    <div id="cartSection" class="cart-section">
      <hr>
      <div class="cart-header">📦 Список к списанию (<span id="cartCount">0</span>):</div>
      <div id="cartList" class="cart-list"></div>

      <button type="button" id="submitBtn" class="btn-submit" onclick="submitBatch()">
        🚀 Отправить всё списание
      </button>
    </div>

    <div id="statusMessage" class="status-msg"></div>
  </div>

  <script>
    // ⚠️ Вставьте ваш актуальный URL развертывания Web App из Google Apps Script
    const WEB_APP_URL = "ВАШ_WEB_APP_URL_ИЗ_APPS_SCRIPT";

    // Глобальный массив корзины
    let cart = [];

    // Переключение категории (скрывает/показывает поле компании)
    function onCategoryChange() {
      const category = document.getElementById('category').value;
      const companyGroup = document.getElementById('companyGroup');
      companyGroup.style.display = (category === 'precursors') ? 'block' : 'none';
    }

    // Добавление позиций в локальную корзину
    function addToCart() {
      const category = document.getElementById('category').value;
      const itemInput = document.getElementById('item');
      const quantityInput = document.getElementById('quantity');
      const companyInput = document.getElementById('company');

      const item = itemInput.value.trim();
      const quantity = parseInt(quantityInput.value, 10);
      const company = companyInput.value.trim();

      if (!item) {
        alert("Пожалуйста, введите название позиции!");
        return;
      }
      if (isNaN(quantity) || quantity <= 0) {
        alert("Введите корректное количество!");
        return;
      }

      // Сохраняем элемент
      cart.push({
        category: category,
        item: item,
        quantity: quantity,
        company: (category === 'precursors') ? company : ''
      });

      // Сбрасываем поля для удобства следующего ввода
      itemInput.value = '';
      quantityInput.value = '1';
      companyInput.value = '';

      renderCart();
    }

    // Удаление элемента из списка
    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    // Отрисовка элементов корзины
    function renderCart() {
      const cartSection = document.getElementById('cartSection');
      const cartList = document.getElementById('cartList');
      const cartCount = document.getElementById('cartCount');

      if (cart.length === 0) {
        cartSection.style.display = 'none';
        return;
      }

      cartSection.style.display = 'block';
      cartCount.textContent = cart.length;
      cartList.innerHTML = '';

      cart.forEach((el, idx) => {
        const categoryBadge = el.category === 'precursors' ? '🧪 Прекурсор' : '🥼 Химия';
        const companyText = el.company ? ` (${el.company})` : '';

        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <div class="cart-item-info">
            <span class="cart-item-title">${el.item} — <b>${el.quantity} шт.</b></span>
            <span class="cart-item-sub">${categoryBadge}${companyText}</span>
          </div>
          <button type="button" class="btn-remove" onclick="removeFromCart(${idx})" title="Удалить">❌</button>
        `;
        cartList.appendChild(div);
      });
    }

    // Массовая отправка списка в Apps Script
    function submitBatch() {
      if (cart.length === 0) return;

      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMessage');

      submitBtn.disabled = true;
      submitBtn.textContent = "⏳ Сохранение и отправка...";
      statusMsg.textContent = "";

      // Собираем данные (проверьте переменные профиля пользователя, если они есть у вас в скрипте)
      const payload = {
        user: (typeof currentUserFio !== 'undefined') ? currentUserFio : "Лазикян Екатерина Ашотовна",
        lab: (typeof currentLab !== 'undefined') ? currentLab : "308",
        items: cart
      };

      fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Текстовый заголовок избавляет от проблем CORS в Apps Script
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          statusMsg.style.color = "#16a34a";
          statusMsg.textContent = "✅ Все списания успешно внесены!";
          cart = [];
          renderCart();
        } else {
          throw new Error(data.error || "Ошибка сервера");
        }
      })
      .catch(err => {
        statusMsg.style.color = "#dc2626";
        statusMsg.textContent = "❌ Ошибка отправки: " + err.message;
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = "🚀 Отправить всё списание";
      });
    }
  </script>
</body>
</html>
